- name: configuring mysql sever
  hosts: mysql
  become: yes
  tasks:
   - name: installing mysql server
     package:
       name: mysql-server
       state: present 
   - name: enable and start the mysql
     service:
       name: mysql-server
       state: started
       enabled: yes
   - name: set mysql root password
     command: mysql_secure_installation --set-root-pass ExpenseApp@1