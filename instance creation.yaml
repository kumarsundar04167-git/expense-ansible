- name: expense instances creation
  hosts: local
  connection: local
  vars: 
    instances: ["mysql", "backend", "frontend", "lb"]
    image_id: ami-0220d79f3f480ecf5
    domain_name: devopsonline.online # replace with your domain
    action: create 
  tasks:
    - name: instance creation
        amazon.aws.ec2_instance:
        name: "expense- {{ instances }}"
        instance_type: t3.micro
        image_id: {{ image_id }
        region: us-east1
        security_group: 
          - expense-common
          - expense-{{ item }}
        loop: "{{ instances }}"
        register= ec2_output
        when: action=="create"

    - name: create r53 record
      amazon.aws.route53:
        region: us-east-1
        zone_id: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        state: present
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when: action == "create"
      when: "{{ instances }}" != lb

    - name: create r53 record for lb
      amazon.aws.route53:
        region: us-east-1
        zone_id: "{{ hosted_zone_id }}"
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        state: present
        overwrite: true
      
   