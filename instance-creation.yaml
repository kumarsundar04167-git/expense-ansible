- name: expense instances creation
  hosts: localhost
  connection: local
  vars: 
    instances: ["mysql", "backend", "frontend", "lb"]
    image_id: ami-0220d79f3f480ecf5
    domain_name: devopsonline.online # replace with your domain
    action: create 
  tasks:
   - name: create ec2 instances
     amazon.aws.ec2_instance:
      instance_type: t3.micro
      name: "expence-{{ item }}"
      image_id: "{{ image_id }}"
      region: us-east-1
      security_groups:
        - "expense-{{ item }}"
     loop: "{{ instances }}"
     register: ec2_output
     when: action == "create"
   - name: create r53 record
     amazon.aws.route53:
        region: us-east-1
        hosted_zone_id: Z04246872QFC8QNNXAS1U
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        state: present
        overwrite: true
     loop: "{{ ec2_output.results }}"
     loop_control:
        label: "{{ item.item }}"
     when:
       - action == "create"
       - item.item != "lb"

   - name: create r53 record for lb
     amazon.aws.route53:
        region: us-east-1
        hosted_zone_id: Z04246872QFC8QNNXAS1U
        record: "{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].public_ip_address }}"
        state: present
        overwrite: true
     loop: "{{ ec2-output.results }}"
     loop_control:
        label: "{{ item.item }}"
     when:
       - action == "create"
       - item.item == "lb"

   - name: delete r53 record for lb
     amazon.aws.route53:
        region: us-east-1
        hosted_zone_id: Z04246872QFC8QNNXAS1U
        record: "{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].public_ip_address }}"
        state: absent
        overwrite: true
     loop: "{{ ec2-output.results }}"
     when:
       - action == "delete"
       - item == "lb"

   - name: delete r53 record
     amazon.aws.route53:
        region: us-east-1
        hosted_zone_id: Z04246872QFC8QNNXAS1U
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        state: absent
        overwrite: true
     loop: "{{ ec2_output.results }}"
     when:
       - action == "delete"
      

   - name: ec2 instance deletion
     amazon.aws.ec2_instance:
        name: "expense- {{ instances }}"
        instance_type: t3.micro
        image_id: "{{ image_id }}"
        region: us-east-1
        wait: false
        security_group: 
          - "expense-{{ item }}"
     loop: "{{ instances }}"
     when: action == "delete"